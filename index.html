<!-- fbflix v2 deploy -->
<!DOCTYPE html>
<html lang="en" data-mode="landing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FBFLIX — Download the App</title>
<meta name="description" content="FBFLIX — watch movies and series on Android. Free. Download the latest APK.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="FBFLIX — Download the App">
<meta property="og:description" content="Watch movies and series on Android. Free.">
<meta property="og:image" content="https://fbflix.site/logo.png">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<script>
// Decide the mode before first paint: a video link shows the player,
// a plain visit shows the download landing page.
(function(){
  var q = new URLSearchParams(location.search);
  var hasVideo = !!(q.get('v') || q.get('id'));
  document.documentElement.dataset.mode = hasVideo ? 'player' : 'landing';
})();
</script>
<style>
* { box-sizing: border-box; }
html, body { background: #000 !important; height: 100%; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }

/* ── Mode visibility ─────────────────────────────────────────────── */
html[data-mode="landing"] #tapOverlay,
html[data-mode="landing"] #plyrWrap { display: none !important; }
html[data-mode="landing"] #root { display: block; }
html[data-mode="player"] #root { display: none; }
html[data-mode="player"] body { overflow: hidden; }

/* The download landing page is a React app that mounts into #root.
   Its styles (Tailwind + theme) and script load only in landing mode,
   so the video player is untouched. */
#root { min-height: 100vh; min-height: 100dvh; }

/* ── Player (unchanged) ────────────────────────────────────────── */
/* Tap-to-play overlay */
#tapOverlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background-size: cover; background-position: center; background-color: #000;
  cursor: pointer;
}
#tapOverlay::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
#tapOverlay.hidden { display: none !important; }
.tapContent { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.tapTitle { font-size: 24px; font-weight: 800; margin-bottom: 16px; text-align: center; padding: 0 24px; text-shadow: 0 2px 16px rgba(0,0,0,0.9); }
.bigPlay {
  width: 100px; height: 100px; border-radius: 50%; background: #e50914;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 60px rgba(229,9,20,0.8); margin-bottom: 16px;
  transition: transform 0.15s;
}
.bigPlay:active { transform: scale(0.92); }
.bigPlay svg { width: 44px; height: 44px; fill: #fff; margin-left: 5px; }
.tapSub { color: rgba(255,255,255,0.85); font-size: 16px; }

/* Loading / error state */
#status { position: relative; z-index: 1; color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 12px; display: none; }

/* Plyr container */
#plyrWrap { position: fixed; inset: 0; background: #000; display: none; }
#plyrWrap.show { display: block; }
.plyr { height: 100%; }
/* Plyr red theme */
:root { --plyr-color-main: #e50914; }

/* Loading spinner — shows while the video buffers, so slow connections
   can tell it is loading and not stuck. */
#loadingSpinner {
  position: absolute; inset: 0; z-index: 90;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.55); pointer-events: none;
}
#loadingSpinner.show { display: flex; }
.spinnerRing {
  width: 56px; height: 56px; border-radius: 50%;
  border: 4px solid rgba(255,255,255,0.25);
  border-top-color: #e50914;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinnerText { margin-top: 14px; color: rgba(255,255,255,0.9); font-size: 15px; }
</style>
</head>
<body>

<!-- Download landing page (React app; shown when there is no video in the URL) -->
<div id="root"></div>

<div id="tapOverlay">
  <div class="tapContent">
    <div class="tapTitle" id="tapTitle">FBFLIX</div>
    <div class="bigPlay" id="bigPlayBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="tapSub" id="tapSub">Tap to play</div>
    <div id="status"></div>
  </div>
</div>

<div id="plyrWrap">
  <video id="video" playsinline></video>
  <div id="loadingSpinner">
    <div class="spinnerRing"></div>
    <div class="spinnerText">Loading video…</div>
  </div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="player.js?v=8"></script>
<script>
// Bootstrap: video mode → player + ads; landing mode → React download page.
(function(){
  var isPlayer = document.documentElement.dataset.mode === 'player';

  if (isPlayer) {
    // Monetag Vignette Banner (zone 12214832) — loaded only when ads are
    // enabled. The on/off switch lives in the admin panel
    // (fbflix.site/admin → Settings). If the setting cannot be read,
    // ads stay off.
    fetch('https://api.fbflix.site/api/ads')
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.enabled) {
          var s = document.createElement('script');
          s.dataset.zone = '12214832';
          s.src = 'https://n6wxm.com/vignette.min.js';
          document.body.appendChild(s);
        }
      })
      .catch(function(){ /* ads stay off if the setting cannot be read */ });
    return;
  }

  // Landing mode: load the download page (React app) — its styles first,
  // then the script, which mounts into #root. The app itself fetches the
  // latest APK from GitHub, so the Download button is always current.
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = '/assets/index-BMUB8cQw.css';
  document.head.appendChild(css);

  var js = document.createElement('script');
  js.type = 'module';
  js.crossOrigin = '';
  js.src = '/assets/index-CxvRo3p6.js';
  document.body.appendChild(js);
})();
</script>
</body>
</html>
