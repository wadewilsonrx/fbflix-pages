<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FBFLIX Player</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000 !important; height: 100%; overflow: hidden; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }

/* Tap-to-play overlay */
#tapOverlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background-size: cover; background-position: center; background-color: #000;
  cursor: pointer;
}
#tapOverlay::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
#tapOverlay.hidden { display: none !important; }
.tapContent { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.tapTitle { font-size: 24px; font-weight: 800; margin-bottom: 16px; text-align: center; padding: 0 24px; text-shadow: 0 2px 16px rgba(0,0,0,0.9); }
.bigPlay {
  width: 100px; height: 100px; border-radius: 50%; background: #e50914;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 60px rgba(229,9,20,0.8); margin-bottom: 16px;
  transition: transform 0.15s;
}
.bigPlay:active { transform: scale(0.92); }
.bigPlay svg { width: 44px; height: 44px; fill: #fff; margin-left: 5px; }
.tapSub { color: rgba(255,255,255,0.85); font-size: 16px; }

/* Loading / error state */
#status { position: relative; z-index: 1; color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 12px; display: none; }

/* Plyr container */
#plyrWrap { position: fixed; inset: 0; background: #000; display: none; }
#plyrWrap.show { display: block; }
.plyr { height: 100%; }
/* Plyr red theme */
:root { --plyr-color-main: #e50914; }
</style>
</head>
<body>

<div id="tapOverlay">
  <div class="tapContent">
    <div class="tapTitle" id="tapTitle">FBFLIX</div>
    <div class="bigPlay" id="bigPlayBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="tapSub" id="tapSub">Tap to play</div>
    <div id="status"></div>
  </div>
</div>

<div id="plyrWrap">
  <video id="video" playsinline></video>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="player.js?v=4"></script>

</body>
</html>
